name: iPhone app checks
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/integrations/supabase/types.ts'
      - 'src/lib/bodyweight.ts'
      - 'src/lib/validation.ts'
      - 'src/lib/nativeOAuth.ts'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/integrations/supabase/types.ts'
      - 'src/lib/bodyweight.ts'
      - 'src/lib/validation.ts'
      - 'src/lib/nativeOAuth.ts'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/mobile.yml'
permissions:
  contents: read
concurrency:
  group: iphone-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      NPM_CONFIG_CACHE: ${{ runner.temp }}/gymtrack-npm-cache
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle:ios
      - run: npx --yes expo-doctor@latest
      - run: npm audit --audit-level=moderate
