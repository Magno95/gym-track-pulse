<main class="app app--kiosk" data-app data-step="idle">
  <video class="app__background" autoplay muted loop playsinline aria-hidden="true" data-background-asset>
    <source src="/assets/video/CrizalBackground.mp4" type="video/mp4" />
  </video>
  <div class="app__background-overlay" aria-hidden="true"></div>
  {{> components/brand-header showTagline=true}}
  <div class="app__content" data-content-root>
    {{> sections/idle}}
    {{> sections/privacy-policy}}
    {{> sections/instructions}}
    {{> sections/camera-capture}}
  </div>
  {{> components/brand-footer}}
</main>
