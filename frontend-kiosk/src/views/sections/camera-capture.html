<section id="camera-capture" class="screen camera-screen" data-screen="camera-capture" data-camera-capture data-camera-state="ready" aria-label="Camera capture">
  <video class="camera-screen__video-source" autoplay muted playsinline data-camera-video></video>
  <canvas class="camera-screen__canvas" data-camera-canvas aria-hidden="true"></canvas>

  <div class="camera-screen__body">
    {{> face_area }}

    <div class="camera-panel camera-panel--ready" data-camera-panel="ready">
      <div class="camera-copy camera-copy--ready">
        <h1 data-copy="camera.readyTitle"></h1>
        <p data-copy="camera.readyBody"></p>
      </div>
    </div>

    <div class="camera-panel camera-panel--countdown" data-camera-panel="countdown">
      <div class="camera-copy camera-copy--countdown">
        <p data-copy="camera.countdownTitle"></p>
        <strong data-capture-countdown>3</strong>
      </div>
    </div>

    <div class="camera-panel camera-panel--review" data-camera-panel="review">
      <div class="camera-copy camera-copy--review">
        <h1 data-copy="camera.reviewTitle"></h1>
        <button class="cta" type="button" data-generate-button>
          <span data-copy="camera.generate"></span>

          <img src="/assets/img/generate_icon.png" alt="Generate icon" width="42" height="42" />
        </button>
        <button class="cta cta-secondary" type="button" data-retake-button data-copy="camera.retake"></button>
      </div>
    </div>

    <div class="camera-panel camera-panel--busy" data-camera-panel="busy">
      <div class="camera-copy camera-copy--review">
        <h1 data-copy="status.creatingSession"></h1>
      </div>
    </div>

    <div class="camera-panel camera-panel--qr" data-camera-panel="qr">
      <div class="camera-copy camera-copy--qr">
        <a class="camera-copy__qr-link" data-mobile-link href="#" target="_blank" rel="noreferrer">
          <div class="camera-copy__qr" data-qr-code aria-label="QR mobile"></div>
        </a>
        <h1 class="camera-copy__qr-title" data-copy="camera.qrTitle"></h1>
        <p data-copy="camera.qrBody"></p>
        <p class="camera-copy__countdown" data-countdown data-countdown-visible="false" aria-live="polite"></p>
        <button class="cta cta-secondary button--with-icon" type="button" data-back-button>
          <span aria-hidden="true">{{> restart }}</span>
          <span data-copy="camera.back"></span>
        </button>
      </div>
    </div>

    <div class="camera-panel camera-panel--error" data-camera-panel="error">
      <div class="camera-copy camera-copy--review">
        <h1 data-copy="status.kioskError"></h1>
        <p class="camera-copy__error" data-error-message></p>
        <button class="cta" type="button" data-retake-button data-copy="camera.retake"></button>
      </div>
    </div>
  </div>

  <output class="camera-screen__status" data-status aria-live="polite"></output>
</section>
