<section id="privacy-policy" class="screen screen--privacy" data-screen="privacy-policy" aria-labelledby="privacy-title">
  <div class="privacy-card">
    <div class="privacy-card__content">
      <h1 id="privacy-title" data-copy="privacy.biometricTitle"></h1>
      <p data-copy="privacy.biometricBody"></p>
      <h2 data-copy="privacy.privacyTitle"></h2>
      <p data-copy="privacy.privacyBody"></p>
    </div>
    <div class="privacy-card__acceptance">
      <p data-copy="privacy.acceptance"></p>
      <div class="screen__actions">
        <button class="cta cta-secondary" type="button" data-next-step="idle" data-copy="privacy.decline"></button>
        <button class="cta" type="button" data-next-step="instructions" data-copy="privacy.accept"></button>
      </div>
    </div>
  </div>
</section>
